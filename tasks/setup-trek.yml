---
- name: Ensure TREK directory exists
  file:
    path: /opt/services/trek
    state: directory
    mode: '0755'

- name: Copy the compose file
  copy:
    src: files/trek/docker-compose.yml
    dest: /opt/services/trek/docker-compose.yml

- name: Inject the configured .env file
  template:
    src: templates/trek.env.j2
    dest: /opt/services/trek/.env
    mode: '0600'

- name: Ensure TREK Docker Compose stack is running
  community.docker.docker_compose_v2:
    project_src: /opt/services/trek
    state: present
    pull: always
