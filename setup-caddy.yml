---
- name: Centralize Caddy Proxy
  hosts: webservers
  become: true

  handlers:
    # restart, not reload: template replaces the file's inode, so the single-file
    # bind mount keeps serving the old Caddyfile until the container is recreated
    - name: restart caddy
      command: docker restart caddy_proxy

  tasks:
    - name: Ensure /opt/caddy directory exists
      file:
        path: /opt/caddy
        state: directory
        mode: '0755'

    - name: Copy Caddy docker-compose file
      copy:
        src: files/docker-compose.caddy.yml
        dest: /opt/caddy/docker-compose.yml

    - name: Ensure the shared external overlay network exists
      docker_network:
        name: webnet
        state: present
        driver: bridge

    - name: Template the master Caddyfile
      template:
        src: templates/Caddyfile.j2
        dest: /opt/caddy/Caddyfile
      notify: restart caddy

    - name: Ensure Caddy container is running
      community.docker.docker_compose_v2:
        project_src: /opt/caddy
        state: present
        pull: always
